name: native validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked -p anagram-core -p anagram-cli
      - run: cargo +stable build --locked -p anagram-cli
      - run: python tools/generate_contracts.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: contracts
      - run: npm run check
        working-directory: contracts
      - run: python -m pip install jsonschema==4.26.0
      - run: python tests/parity/contracts.py
      - run: python tests/parity/scoring.py
      - run: python -m unittest discover -s tests/quality -v
      - run: python tests/parity/generation.py
      - run: python tests/parity/refinement.py
      - name: Provision WordNet for grammar regression
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('archive') if Path('archive').exists() else Path('.')))
          import anagram_rerank_core as reference
          reference.ensure_wordnet(reference.DEFAULT_WORDNET_DIR)
          PY
      - run: python tests/parity/grammar.py
