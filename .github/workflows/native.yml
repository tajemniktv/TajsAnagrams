name: native validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_INCREMENTAL: '0'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add clippy rustfmt
      - name: Cache Rust dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> build'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - name: Authoritative native invariants and development-tool checks
        run: cargo xtask check
      # Synthetic native WordNet/corpus fixtures make ordinary checks offline;
      # corpus-dependent quality/performance jobs remain explicitly informational.
