name: native phrase data and quality

on:
  pull_request:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      include_wikipedia:
        description: "Also build the expensive combined Wikipedia title corpus"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phrase-benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-phrase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: '. -> build'
      - run: cargo build --release --locked -p anagram-cli
      - name: Monthly input snapshot
        id: month
        run: echo "value=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/phrase-data
          key: native-phrase-${{ runner.os }}-${{ steps.month.outputs.value }}-${{ inputs.include_wikipedia || false }}-${{ hashFiles('crates/anagram-cli/src/**', 'tools/prepare-native-data.ps1') }}
      - name: Native dictionary and phrase preparation (no Python engine)
        shell: pwsh
        run: |
          if (-not (Test-Path build/phrase-data/manifest.json)) {
            $parameters = @{
              NativeCli = 'build/release/anagram-cli'
              OutputDirectory = "$env:GITHUB_WORKSPACE/build/phrase-data"
              IncludeWiktionary = $true
              IncludeWikipedia = ("${{ inputs.include_wikipedia }}" -eq 'true')
            }
            & ./tools/prepare-native-data.ps1 @parameters
          }
      - name: Native full-solve phrase A/B, fixed profile and explicit input hashes
        if: github.event_name != 'schedule'
        run: |
          mkdir -p .codex/temp/phrase-report
          for mode in baseline phrases; do
            extra=()
            if [ "$mode" = phrases ]; then extra+=(--phrase-db build/phrase-data/phrases.db); fi
            cargo xtask benchmark --cli build/release/anagram-cli --dictionary build/phrase-data/dictionary/normal_user_v2.txt --unigrams build/phrase-data/ngrams/count_1w.txt --bigrams build/phrase-data/ngrams/count_2w.txt --wordnet build/phrase-data/wordnet31/dict --timeout-ms 10000 --seed 13 --output ".codex/temp/phrase-report/$mode.jsonl" "${extra[@]}"
            cargo xtask quality --runs ".codex/temp/phrase-report/$mode.jsonl" --usefulness tests/quality/usefulness.v1.json --output ".codex/temp/phrase-report/$mode.report.json"
          done
      - name: Native grouped trainer (informational, never a promotion gate)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          jq '{cases:[.cases[] | select((.suites // ["all"]) | any(. == "core" or . == "all" or . == "feature_ranker"))],options:{retained_orders:56,phrase_bonus_max:10}}' anagram_benchmarks.json | build/release/anagram-cli ranker-build build/phrase-data/wordnet31/dict build/phrase-data/phrases.db > .codex/temp/phrase-report/groups.json
          jq '{groups:.groups,options:{folds:5,epochs:80,learning_rate:0.08,l2:0.002}}' .codex/temp/phrase-report/groups.json | build/release/anagram-cli ranker-train .codex/temp/phrase-report/model.json > .codex/temp/phrase-report/training.report.json
      - name: Upload reports only, not corpora or trained models
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-phrase-reports
          path: .codex/temp/phrase-report/*.report.json
          if-no-files-found: warn
