[workspace]
members = ["crates/anagram-core", "crates/anagram-cli", "apps/desktop/src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
unicode-normalization = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep symbols small while reusing local codegen across source edits.
# CI overrides CARGO_INCREMENTAL=0: only dependency artifacts are cached there.
[profile.dev]
debug = 0
incremental = true

[profile.release]
incremental = true
